<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据总览 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="header">
    <h1>
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.4 11 12.6 6.6a1.6 1.6 0 0 0-1.2 0L2.6 11a1 1 0 0 0 0 1.8l8.8 4.4a1.6 1.6 0 0 0 1.2 0l8.8-4.4a1 1 0 0 0 0-1.8Z"/>
            <path d="M22 10.5V16"/>
            <path d="M6 12.9V17a6 3 0 0 0 12 0v-4.1"/>
        </svg>
        <span class="grad-text">校园活动报名系统</span>
        <span class="header-badge">管理后台</span>
    </h1>
    <div class="nav">
        <a th:href="@{/index}" class="active">数据总览</a>
        <a th:href="@{/activity/list}">活动管理</a>
        <a th:href="@{/registration/list}">报名管理</a>
    </div>
    <div class="user-info">
        <span class="user-chip admin"><span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container">
    <div class="welcome">
        <div class="welcome-content">
            <h2>欢迎回来，<span th:text="${user.realName}"></span></h2>
            <p>以下是系统最新的数据概览，掌握校园活动的整体情况</p>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="number" th:text="${activityCount}">0</div>
            <div class="label">活动总数</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${publishedCount}">0</div>
            <div class="label">进行中活动</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${registrationCount}">0</div>
            <div class="label">有效报名数</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${userCount}">0</div>
            <div class="label">注册用户数</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h3>最近创建的活动</h3>
            <a th:href="@{/activity/list}">查看全部 →</a>
        </div>
        <div class="table-wrap" th:if="${recentActivities != null and !recentActivities.isEmpty()}">
            <table>
                <tr>
                    <th>ID</th>
                    <th>活动标题</th>
                    <th>地点</th>
                    <th>开始时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                <tr th:each="a : ${recentActivities}">
                    <td th:text="${a.id}"></td>
                    <td class="cell-title" th:text="${a.title}"></td>
                    <td th:text="${a.location}"></td>
                    <td th:text="${a.startTime != null} ? ${#dates.format(a.startTime, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                    <td>
                        <span class="status-tag status-published" th:if="${a.status == 'published'}">已发布</span>
                        <span class="status-tag status-ongoing" th:if="${a.status == 'ongoing'}">进行中</span>
                        <span class="status-tag status-ended" th:if="${a.status == 'ended'}">已结束</span>
                        <span class="status-tag status-offline" th:if="${a.status == 'offline'}">已下线</span>
                    </td>
                    <td style="white-space:nowrap;">
                        <a th:href="@{/activity/detail(id=${a.id})}" class="link-primary">详情</a>
                        <a th:href="@{/activity/toEdit(id=${a.id})}" class="link-primary">编辑</a>
                    </td>
                </tr>
            </table>
        </div>
        <div th:if="${recentActivities == null or recentActivities.isEmpty()}" class="empty" style="box-shadow:none;border:none;">
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                    <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
                </svg>
            </div>
            <h3>暂无活动数据</h3>
            <p>快去发布第一个活动吧</p>
        </div>
    </div>
</div>
</body>
</html>
