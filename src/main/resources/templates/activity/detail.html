<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动详情 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="header">
    <div style="display:flex;align-items:center;">
        <button class="back-btn" th:data-home="${user != null and user.role == 'student' ? '/home' : '/index'}" onclick="goBack(this)" title="返回">‹</button>
        <h1>
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.4 11 12.6 6.6a1.6 1.6 0 0 0-1.2 0L2.6 11a1 1 0 0 0 0 1.8l8.8 4.4a1.6 1.6 0 0 0 1.2 0l8.8-4.4a1 1 0 0 0 0-1.8Z"/>
                <path d="M22 10.5V16"/>
                <path d="M6 12.9V17a6 3 0 0 0 12 0v-4.1"/>
            </svg>
            <span class="grad-text">校园活动报名系统</span>
        </h1>
    </div>
    <div class="user-info">
        <span class="user-chip student" th:if="${user != null and user.role == 'student'}"><span th:text="${user.realName}"></span></span>
        <span class="user-chip admin" th:if="${user != null and user.role == 'admin'}"><span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container-narrow">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div th:if="${activity != null}" class="detail-card">
        <div th:unless="${activity.coverImage != null and !activity.coverImage.isEmpty()}" class="cover"><span th:text="${#strings.substring(activity.title, 0, 1)}"></span></div>
        <img th:if="${activity.coverImage != null and !activity.coverImage.isEmpty()}" th:src="${activity.coverImage}" class="cover-img">
        <div class="detail-body">
            <div class="title-row">
                <h1 class="detail-title" th:text="${activity.title}"></h1>
                <span class="status-badge badge-published" th:if="${activity.status == 'published'}">已发布 · 可报名</span>
                <span class="status-badge badge-ongoing" th:if="${activity.status == 'ongoing'}">进行中</span>
                <span class="status-badge badge-ended" th:if="${activity.status == 'ended'}">已结束</span>
                <span class="status-badge badge-offline" th:if="${activity.status == 'offline'}">已下线</span>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <div class="meta-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                    </div>
                    <div>
                        <div class="meta-label">活动地点</div>
                        <div class="meta-value" th:text="${activity.location} != null ? ${activity.location} : '待定'"></div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div>
                        <div class="meta-label">报名限制</div>
                        <div class="meta-value">
                            <span th:if="${activity.maxParticipants != null and activity.maxParticipants > 0}" th:text="'限 ' + ${activity.maxParticipants} + ' 人'"></span>
                            <span th:if="${activity.maxParticipants == null or activity.maxParticipants == 0}">不限人数</span>
                        </div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    </div>
                    <div>
                        <div class="meta-label">开始时间</div>
                        <div class="meta-value" th:text="${activity.startTime != null} ? ${#dates.format(activity.startTime, 'yyyy-MM-dd HH:mm')} : '-'"></div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg>
                    </div>
                    <div>
                        <div class="meta-label">结束时间</div>
                        <div class="meta-value" th:text="${activity.endTime != null} ? ${#dates.format(activity.endTime, 'yyyy-MM-dd HH:mm')} : '-'"></div>
                    </div>
                </div>
                <div class="meta-item" th:if="${activity.deadline != null}">
                    <div class="meta-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </div>
                    <div>
                        <div class="meta-label">报名截止</div>
                        <div class="meta-value" th:text="${#dates.format(activity.deadline, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                </div>
            </div>

            <div class="desc-section" th:if="${activity.description != null}">
                <h3>活动详情</h3>
                <div class="desc-content" th:text="${activity.description}"></div>
            </div>

            <div class="action-bar">
                <div class="registration-count">
                    已有 <strong th:text="${activity.registeredCount != null} ? ${activity.registeredCount} : 0">0</strong> 人报名参加
                </div>
                <div>
                    <form th:action="@{/registration/join}" method="post" th:if="${user != null and user.role == 'student' and activity.status == 'published'}">
                        <input type="hidden" name="activityId" th:value="${activity.id}">
                        <button type="submit" class="btn btn-primary"
                                th:disabled="${activity.maxParticipants != null and activity.maxParticipants > 0 and (activity.registeredCount != null and activity.registeredCount >= activity.maxParticipants)}">
                            立即报名
                        </button>
                    </form>
                    <span th:if="${activity.status == 'offline'}" class="offline-note">该活动已下线</span>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${activity == null}" class="not-found">
        <div class="big-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
                <path d="M9 9h.01M15 9h.01"/>
            </svg>
        </div>
        <h2>活动不存在或已被删除</h2>
        <p style="margin-top:10px;">请返回活动列表查看其他精彩活动</p>
    </div>
</div>
<script src="/js/main.js"></script>
</body>
</html>
