<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .home-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 24px;
            padding: 40px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            box-shadow: 0 16px 40px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        .home-hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 300px; height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .home-hero::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -5%;
            width: 200px; height: 200px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .home-hero-content h2 { font-size: 26px; margin-bottom: 8px; position: relative; z-index: 1; }
        .home-hero-content p { font-size: 15px; opacity: 0.9; position: relative; z-index: 1; }
        .home-hero-emoji { font-size: 80px; position: relative; z-index: 1; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }
        .stat-icon { font-size: 36px; margin-bottom: 12px; }
        .stat-number { font-size: 32px; font-weight: 800; color: #1d1d1f; margin-bottom: 4px; }
        .stat-label { font-size: 14px; color: #86868b; }
        .stat-card.gradient-1 { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); }
        .stat-card.gradient-2 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .stat-card.gradient-3 { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
        .stat-card.gradient-4 { background: linear-gradient(135deg, #84fab0, #8fd3f4); }
        .section-card {
            background: #fff;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title a {
            font-size: 14px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .section-title a:hover { text-decoration: underline; }
        .activity-row {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .activity-row:last-child { border-bottom: none; }
        .activity-row .act-emoji {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-right: 14px;
            flex-shrink: 0;
        }
        .activity-row .act-info { flex: 1; }
        .activity-row .act-title { font-weight: 600; color: #1d1d1f; font-size: 15px; margin-bottom: 3px; }
        .activity-row .act-meta { font-size: 12px; color: #86868b; }
        .activity-row .act-join {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 7px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .activity-row .act-join:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(102,126,234,0.4); }
        .my-row {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .my-row:last-child { border-bottom: none; }
        .my-row .my-dot {
            width: 10px; height: 10px; border-radius: 50%;
            margin-right: 14px; flex-shrink: 0;
        }
        .my-row .my-dot.reg { background: #feca57; box-shadow: 0 0 8px rgba(254,202,87,0.5); }
        .my-row .my-dot.ok { background: #26de81; box-shadow: 0 0 8px rgba(38,222,129,0.5); }
        .my-row .my-dot.rej { background: #fc5c65; box-shadow: 0 0 8px rgba(252,92,101,0.5); }
        .my-row .my-dot.cancel { background: #a4b0be; }
        .my-row .my-info { flex: 1; }
        .my-row .my-title { font-weight: 600; color: #1d1d1f; font-size: 15px; margin-bottom: 3px; }
        .my-row .my-time { font-size: 12px; color: #86868b; }
        .quick-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }
        .quick-nav a {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            text-decoration: none;
            color: #1d1d1f;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            display: block;
        }
        .quick-nav a:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.12); }
        .quick-nav .qn-emoji { font-size: 38px; margin-bottom: 8px; }
        .quick-nav .qn-text { font-size: 15px; font-weight: 600; }
        .empty-hint { text-align: center; padding: 20px; color: #86868b; font-size: 14px; }
    </style>
</head>
<body>
<div class="header">
    <h1>🎓 <span class="grad-text">校园活动报名系统</span></h1>
    <div class="nav">
        <a th:href="@{/home}" class="active">🏠 我的主页</a>
        <a th:href="@{/activity/list}">📅 活动广场</a>
        <a th:href="@{/registration/my}">🎫 我的报名</a>
    </div>
    <div class="user-info">
        <span class="user-chip student">✨ <span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container">
    <div class="home-hero">
        <div class="home-hero-content">
            <h2>👋 你好，<span th:text="${user.realName}"></span>！</h2>
            <p>欢迎回到校园活动中心，快来看看最近有什么精彩活动吧～</p>
        </div>
        <div class="home-hero-emoji">🎉</div>
    </div>

    <div class="stat-grid">
        <div class="stat-card gradient-1">
            <div class="stat-icon">📚</div>
            <div class="stat-number" th:text="${totalActivities}">0</div>
            <div class="stat-label">活动总数</div>
        </div>
        <div class="stat-card gradient-2">
            <div class="stat-icon">🚀</div>
            <div class="stat-number" th:text="${ongoingActivities}">0</div>
            <div class="stat-label">可报名活动</div>
        </div>
        <div class="stat-card gradient-3">
            <div class="stat-icon">🎫</div>
            <div class="stat-number" th:text="${myTotal}">0</div>
            <div class="stat-label">我的报名</div>
        </div>
        <div class="stat-card gradient-4">
            <div class="stat-icon">✅</div>
            <div class="stat-number" th:text="${myApproved}">0</div>
            <div class="stat-label">已通过</div>
        </div>
    </div>

    <div class="quick-nav">
        <a th:href="@{/activity/list}">
            <div class="qn-emoji">📅</div>
            <div class="qn-text">活动广场</div>
        </a>
        <a th:href="@{/registration/my}">
            <div class="qn-emoji">🎫</div>
            <div class="qn-text">我的报名</div>
        </a>
        <a th:href="@{/activity/list}">
            <div class="qn-emoji">🔍</div>
            <div class="qn-text">发现更多</div>
        </a>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>🔥 热门活动 TOP5</span>
            <a th:href="@{/activity/list}">查看全部 →</a>
        </div>
        <div th:if="${hotActivities != null and !hotActivities.isEmpty()}">
            <div class="activity-row" th:each="act : ${hotActivities}">
                <div class="act-emoji">🔥</div>
                <div class="act-info">
                    <div class="act-title" th:text="${act.title}"></div>
                    <div class="act-meta" th:text="'📍 ' + ${act.location} + '  ·  👥 已报 ' + ${act.registeredCount != null ? act.registeredCount : 0} + ' 人'"></div>
                </div>
                <a th:href="@{/activity/detail(id=${act.id})}" class="act-join">去看看</a>
            </div>
        </div>
        <div th:if="${hotActivities == null or hotActivities.isEmpty()}" class="empty-hint">暂时没有可报名的活动，去活动广场逛逛吧～</div>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>📋 我的最近报名</span>
            <a th:href="@{/registration/my}">全部报名 →</a>
        </div>
        <div th:if="${myLatest != null and !myLatest.isEmpty()}">
            <div class="my-row" th:each="reg : ${myLatest}">
                <div class="my-dot reg" th:if="${reg.status == 'registered'}"></div>
                <div class="my-dot ok" th:if="${reg.status == 'approved'}"></div>
                <div class="my-dot rej" th:if="${reg.status == 'rejected'}"></div>
                <div class="my-dot cancel" th:if="${reg.status == 'cancelled'}"></div>
                <div class="my-info">
                    <div class="my-title" th:text="${reg.activityTitle}"></div>
                    <div class="my-time">
                        <span th:if="${reg.status == 'registered'}">⏳ 待审核</span>
                        <span th:if="${reg.status == 'approved'}">✅ 已通过</span>
                        <span th:if="${reg.status == 'rejected'}">❌ 已拒绝</span>
                        <span th:if="${reg.status == 'cancelled'}">🚫 已取消</span>
                        <span th:text="'  ·  ' + ${#dates.format(reg.registerTime, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${myLatest == null or myLatest.isEmpty()}" class="empty-hint">你还没有报名任何活动，快去参加一个吧～</div>
    </div>
</div>
</body>
</html>
