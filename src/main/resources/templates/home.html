<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .home-hero {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px 30px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-xs);
        }
        .home-hero h2 {
            font-size: 22px; font-weight: 700; margin-bottom: 6px;
            display: flex; align-items: center; gap: 10px;
        }
        .home-hero h2::before {
            content: ''; width: 5px; height: 20px; border-radius: 3px;
            background: var(--primary); flex-shrink: 0;
        }
        .home-hero p { font-size: 14px; color: var(--text-light); padding-left: 15px; }

        .quick-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        .quick-nav a {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            color: var(--text-dark);
            box-shadow: var(--shadow-xs);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14.5px;
            font-weight: 600;
        }
        .quick-nav a:hover { border-color: var(--primary); box-shadow: var(--shadow-sm); }
        .quick-nav .qn-arrow { color: var(--text-light); font-weight: 400; transition: color 0.18s ease, transform 0.18s ease; }
        .quick-nav a:hover .qn-arrow { color: var(--primary); transform: translateX(2px); }

        .section-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
            box-shadow: var(--shadow-xs);
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 15.5px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--row-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title a {
            font-size: 13px;
            color: var(--primary);
            font-weight: 500;
        }
        .section-title a:hover { color: var(--primary-hover); text-decoration: underline; }

        .activity-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--row-line);
        }
        .activity-row:last-child { border-bottom: none; padding-bottom: 2px; }
        .activity-row .act-rank {
            width: 28px; height: 28px;
            border-radius: 8px;
            background: #f1f2f6;
            color: var(--text-light);
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .activity-row .act-rank.top { background: var(--primary-soft); color: var(--primary); }
        .activity-row .act-info { flex: 1; min-width: 0; }
        .activity-row .act-title {
            font-weight: 600; color: var(--text-dark); font-size: 14.5px; margin-bottom: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .activity-row .act-meta { font-size: 12.5px; color: var(--text-light); }
        .activity-row .act-join {
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.18s ease, color 0.18s ease;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .activity-row .act-join:hover { background: var(--primary); color: #fff; }

        .my-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--row-line);
        }
        .my-row:last-child { border-bottom: none; padding-bottom: 2px; }
        .my-row .my-dot {
            width: 8px; height: 8px; border-radius: 50%;
            margin-right: 14px; flex-shrink: 0;
        }
        .my-row .my-dot.reg { background: #d9a441; }
        .my-row .my-dot.ok { background: var(--success); }
        .my-row .my-dot.rej { background: var(--danger); }
        .my-row .my-dot.cancel { background: #b9bec9; }
        .my-row .my-info { flex: 1; min-width: 0; }
        .my-row .my-title {
            font-weight: 600; color: var(--text-dark); font-size: 14.5px; margin-bottom: 2px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .my-row .my-time { font-size: 12.5px; color: var(--text-light); }
        .empty-hint { text-align: center; padding: 22px; color: var(--text-light); font-size: 13.5px; }

        @media (max-width: 768px) {
            .quick-nav { grid-template-columns: 1fr; }
            .home-hero { padding: 22px 20px; }
            .home-hero h2 { font-size: 19px; }
            .section-card { padding: 18px 16px; }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.4 11 12.6 6.6a1.6 1.6 0 0 0-1.2 0L2.6 11a1 1 0 0 0 0 1.8l8.8 4.4a1.6 1.6 0 0 0 1.2 0l8.8-4.4a1 1 0 0 0 0-1.8Z"/>
            <path d="M22 10.5V16"/>
            <path d="M6 12.9V17a6 3 0 0 0 12 0v-4.1"/>
        </svg>
        <span class="grad-text">校园活动报名系统</span>
    </h1>
    <div class="nav">
        <a th:href="@{/home}" class="active">我的主页</a>
        <a th:href="@{/activity/list}">活动广场</a>
        <a th:href="@{/registration/my}">我的报名</a>
    </div>
    <div class="user-info">
        <span class="user-chip student"><span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container">
    <div class="home-hero">
        <h2>你好，<span th:text="${user.realName}"></span></h2>
        <p>欢迎回到校园活动中心，看看最近有哪些精彩活动</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="number" th:text="${totalActivities}">0</div>
            <div class="label">活动总数</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${ongoingActivities}">0</div>
            <div class="label">可报名活动</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${myTotal}">0</div>
            <div class="label">我的报名</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${myApproved}">0</div>
            <div class="label">已通过</div>
        </div>
    </div>

    <div class="quick-nav">
        <a th:href="@{/activity/list}">
            <span>活动广场</span>
            <span class="qn-arrow">→</span>
        </a>
        <a th:href="@{/registration/my}">
            <span>我的报名</span>
            <span class="qn-arrow">→</span>
        </a>
        <a th:href="@{/activity/list}">
            <span>发现更多</span>
            <span class="qn-arrow">→</span>
        </a>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>热门活动 TOP5</span>
            <a th:href="@{/activity/list}">查看全部 →</a>
        </div>
        <div th:if="${hotActivities != null and !hotActivities.isEmpty()}">
            <div class="activity-row" th:each="act,actStat : ${hotActivities}">
                <div class="act-rank" th:classappend="${actStat.index < 3} ? ' top'" th:text="${actStat.index + 1}">1</div>
                <div class="act-info">
                    <div class="act-title" th:text="${act.title}"></div>
                    <div class="act-meta" th:text="${act.location} + ' · 已报 ' + ${act.registeredCount != null ? act.registeredCount : 0} + ' 人'"></div>
                </div>
                <a th:href="@{/activity/detail(id=${act.id})}" class="act-join">去看看</a>
            </div>
        </div>
        <div th:if="${hotActivities == null or hotActivities.isEmpty()}" class="empty-hint">暂时没有可报名的活动，去活动广场逛逛吧</div>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>我的最近报名</span>
            <a th:href="@{/registration/my}">全部报名 →</a>
        </div>
        <div th:if="${myLatest != null and !myLatest.isEmpty()}">
            <div class="my-row" th:each="reg : ${myLatest}">
                <div class="my-dot reg" th:if="${reg.status == 'registered'}"></div>
                <div class="my-dot ok" th:if="${reg.status == 'approved'}"></div>
                <div class="my-dot rej" th:if="${reg.status == 'rejected'}"></div>
                <div class="my-dot cancel" th:if="${reg.status == 'cancelled'}"></div>
                <div class="my-info">
                    <div class="my-title" th:text="${reg.activityTitle}"></div>
                    <div class="my-time">
                        <span th:if="${reg.status == 'registered'}">待审核</span>
                        <span th:if="${reg.status == 'approved'}">已通过</span>
                        <span th:if="${reg.status == 'rejected'}">已拒绝</span>
                        <span th:if="${reg.status == 'cancelled'}">已取消</span>
                        <span th:text="' · ' + ${#dates.format(reg.registerTime, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${myLatest == null or myLatest.isEmpty()}" class="empty-hint">你还没有报名任何活动，快去参加一个吧</div>
    </div>
</div>
</body>
</html>
