<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* 首页专用组件样式统一由 /css/style.css 提供 */
    </style>
</head>
<body>
<div class="header">
    <h1>🎓 <span class="grad-text">校园活动报名系统</span></h1>
    <div class="nav">
        <a th:href="@{/home}" class="active">🏠 我的主页</a>
        <a th:href="@{/activity/list}">📅 活动广场</a>
        <a th:href="@{/registration/my}">🎫 我的报名</a>
    </div>
    <div class="user-info">
        <span class="user-chip student">✨ <span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container">
    <div class="home-hero">
        <div class="home-hero-content">
            <h2>👋 你好，<span th:text="${user.realName}"></span>！</h2>
            <p>欢迎回到校园活动中心，快来看看最近有什么精彩活动吧～</p>
        </div>
        <div class="home-hero-emoji">🎉</div>
    </div>

    <div class="stat-grid">
        <div class="stat-card gradient-1">
            <div class="stat-icon">📚</div>
            <div class="stat-number" th:text="${totalActivities}">0</div>
            <div class="stat-label">活动总数</div>
        </div>
        <div class="stat-card gradient-2">
            <div class="stat-icon">🚀</div>
            <div class="stat-number" th:text="${ongoingActivities}">0</div>
            <div class="stat-label">可报名活动</div>
        </div>
        <div class="stat-card gradient-3">
            <div class="stat-icon">🎫</div>
            <div class="stat-number" th:text="${myTotal}">0</div>
            <div class="stat-label">我的报名</div>
        </div>
        <div class="stat-card gradient-4">
            <div class="stat-icon">✅</div>
            <div class="stat-number" th:text="${myApproved}">0</div>
            <div class="stat-label">已通过</div>
        </div>
    </div>

    <div class="quick-nav">
        <a th:href="@{/activity/list}">
            <div class="qn-emoji">📅</div>
            <div class="qn-text">活动广场</div>
        </a>
        <a th:href="@{/registration/my}">
            <div class="qn-emoji">🎫</div>
            <div class="qn-text">我的报名</div>
        </a>
        <a th:href="@{/activity/list}">
            <div class="qn-emoji">🔍</div>
            <div class="qn-text">发现更多</div>
        </a>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>🔥 热门活动 TOP5</span>
            <a th:href="@{/activity/list}">查看全部 →</a>
        </div>
        <div th:if="${hotActivities != null and !hotActivities.isEmpty()}">
            <div class="activity-row" th:each="act : ${hotActivities}">
                <div class="act-emoji">🔥</div>
                <div class="act-info">
                    <div class="act-title" th:text="${act.title}"></div>
                    <div class="act-meta" th:text="'📍 ' + ${act.location} + '  ·  👥 已报 ' + ${act.registeredCount != null ? act.registeredCount : 0} + ' 人'"></div>
                </div>
                <a th:href="@{/activity/detail(id=${act.id})}" class="act-join">去看看</a>
            </div>
        </div>
        <div th:if="${hotActivities == null or hotActivities.isEmpty()}" class="empty-hint">暂时没有可报名的活动，去活动广场逛逛吧～</div>
    </div>

    <div class="section-card">
        <div class="section-title">
            <span>📋 我的最近报名</span>
            <a th:href="@{/registration/my}">全部报名 →</a>
        </div>
        <div th:if="${myLatest != null and !myLatest.isEmpty()}">
            <div class="my-row" th:each="reg : ${myLatest}">
                <div class="my-dot reg" th:if="${reg.status == 'registered'}"></div>
                <div class="my-dot ok" th:if="${reg.status == 'approved'}"></div>
                <div class="my-dot rej" th:if="${reg.status == 'rejected'}"></div>
                <div class="my-dot cancel" th:if="${reg.status == 'cancelled'}"></div>
                <div class="my-info">
                    <div class="my-title" th:text="${reg.activityTitle}"></div>
                    <div class="my-time">
                        <span th:if="${reg.status == 'registered'}">⏳ 待审核</span>
                        <span th:if="${reg.status == 'approved'}">✅ 已通过</span>
                        <span th:if="${reg.status == 'rejected'}">❌ 已拒绝</span>
                        <span th:if="${reg.status == 'cancelled'}">🚫 已取消</span>
                        <span th:text="'  ·  ' + ${#dates.format(reg.registerTime, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${myLatest == null or myLatest.isEmpty()}" class="empty-hint">你还没有报名任何活动，快去参加一个吧～</div>
    </div>
</div>
</body>
</html>
