<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园活动报名系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; }
        html, body { height: 100%; }
        body {
            background: #f5f5f7;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; top: -32%; right: -18%;
            width: 640px; height: 640px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,113,227,0.10), transparent 68%);
            pointer-events: none;
        }
        body::after {
            content: ''; position: fixed; bottom: -30%; left: -14%;
            width: 560px; height: 560px; border-radius: 50%;
            background: radial-gradient(circle, rgba(90,200,250,0.12), transparent 68%);
            pointer-events: none;
        }
        .login-box {
            width: 420px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            padding: 46px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.05);
            position: relative; z-index: 1;
            animation: rise 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .logo {
            width: 72px; height: 72px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #0071e3, #0a84ff);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px;
            box-shadow: 0 10px 26px rgba(0,113,227,0.32);
        }
        h2 { text-align: center; color: #1d1d1f; font-weight: 700; font-size: 26px; margin-bottom: 8px; letter-spacing: -0.01em; }
        .subtitle { text-align: center; color: #86868b; font-size: 14px; margin-bottom: 36px; line-height: 1.7; }
        .form-item { margin-bottom: 22px; }
        label { display: block; color: #333336; font-size: 13px; font-weight: 600; margin-bottom: 9px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 14px 16px;
            border: 1px solid #d2d2d7; border-radius: 12px;
            font-size: 15px; background: #fafafa;
            outline: none; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            font-family: inherit; color: #1d1d1f;
        }
        input:focus { border-color: #0071e3; background: #fff; box-shadow: 0 0 0 4px rgba(0,113,227,0.12); }
        .login-btn {
            width: 100%; padding: 15px;
            border: none; border-radius: 980px;
            font-size: 16px; font-weight: 600;
            background: #0071e3; color: #fff;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            margin-top: 12px; letter-spacing: 2px;
            font-family: inherit;
        }
        .login-btn:hover { background: #0077ed; }
        .login-btn:active { background: #006edb; transform: scale(0.98); }
        .error-msg {
            color: #ff3b30; font-size: 14px; text-align: center;
            margin-bottom: 20px; padding: 11px 14px;
            background: rgba(255,59,48,0.08); border-radius: 12px;
            border: 1px solid rgba(255,59,48,0.15);
        }
        .tips {
            margin-top: 26px; padding-top: 20px;
            border-top: 1px solid #e8e8ed;
            font-size: 12px; color: #86868b; text-align: center; line-height: 2;
        }
        .tips code {
            background: rgba(0,113,227,0.08); padding: 3px 10px; border-radius: 6px;
            color: #0071e3; font-family: inherit; font-weight: 600; margin: 0 2px;
        }
        .tips .user-types { margin-top: 8px; display: flex; justify-content: center; gap: 10px; }
        .tips .user-type { padding: 5px 13px; border-radius: 980px; font-size: 11px; font-weight: 600; }
        .tips .admin-type { background: rgba(255,149,0,0.14); color: #9a5300; }
        .tips .student-type { background: rgba(0,113,227,0.10); color: #0071e3; }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">🎓</div>
    <h2>校园活动报名系统</h2>
    <p class="subtitle">加入精彩校园生活，<br>遇见有趣的灵魂 ✨</p>

    <div th:if="${error}" class="error-msg">⚠️ <span th:text="${error}"></span></div>

    <form th:action="@{/login}" method="post">
        <div class="form-item">
            <label>👤 用户名</label>
            <input type="text" name="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
        <div class="form-item">
            <label>🔒 密码</label>
            <input type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">开 始 校 园 之 旅</button>
    </form>

    <div class="tips">
        🍀 测试账号
        <div class="user-types">
            <span class="user-type admin-type">👨‍💼 管理员：<code>admin</code></span>
            <span class="user-type student-type">🎓 学生：<code>student01</code></span>
        </div>
        <div style="margin-top:8px;">密码统一：<code>123456</code></div>
    </div>
</div>
</body>
</html>
