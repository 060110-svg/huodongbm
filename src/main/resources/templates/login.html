<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园活动报名系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(900px 480px at 50% -140px, #eceefc 0%, rgba(236,238,252,0) 70%),
                #f6f7f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        .login-box {
            width: 420px;
            max-width: 100%;
            background: #fff;
            padding: 44px 40px 36px;
            border-radius: 18px;
            border: 1px solid #e7e9ef;
            box-shadow: 0 8px 32px rgba(20, 24, 40, 0.08);
        }
        .logo {
            width: 60px; height: 60px;
            margin: 0 auto 20px;
            background: #eef2ff;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #4f46e5;
        }
        .logo svg { width: 30px; height: 30px; }
        h2 { text-align: center; color: #1c1e26; font-weight: 700; font-size: 22px; margin-bottom: 6px; }
        .subtitle { text-align: center; color: #8b90a0; font-size: 13.5px; margin-bottom: 32px; }
        .form-item { margin-bottom: 20px; }
        label { display: block; color: #43475a; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dfe2e8;
            border-radius: 10px;
            font-size: 14.5px;
            font-family: inherit;
            background: #fff;
            color: #1c1e26;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }
        input::placeholder { color: #a7abb8; }
        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            background: #4f46e5;
            color: #fff;
            cursor: pointer;
            letter-spacing: 6px;
            text-indent: 6px;
            transition: background 0.18s ease;
            margin-top: 6px;
            box-shadow: 0 1px 2px rgba(20, 24, 40, 0.06);
        }
        .login-btn:hover { background: #4338ca; }
        .login-btn:active { background: #3c33b8; }
        .error-msg {
            color: #b23434;
            font-size: 13.5px;
            text-align: center;
            margin-bottom: 18px;
            padding: 11px 14px;
            background: #fdeeee;
            border: 1px solid #f6dada;
            border-radius: 10px;
        }
        .tips {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px dashed #e2e5ec;
            font-size: 12px;
            color: #8b90a0;
            text-align: center;
            line-height: 1.9;
        }
        .tips code {
            background: #eef2ff;
            padding: 2px 8px;
            border-radius: 6px;
            color: #4f46e5;
            font-family: inherit;
            font-weight: 600;
            margin: 0 2px;
        }
        .tips .user-types { margin-top: 8px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .tips .user-type { padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
        .tips .admin-type { background: #fdf3e3; color: #a15c05; }
        .tips .student-type { background: #eef2ff; color: #4f46e5; }
        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid #4f46e5; outline-offset: 2px;
        }
        @media (max-width: 480px) {
            .login-box { padding: 36px 24px 28px; border-radius: 14px; }
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.4 11 12.6 6.6a1.6 1.6 0 0 0-1.2 0L2.6 11a1 1 0 0 0 0 1.8l8.8 4.4a1.6 1.6 0 0 0 1.2 0l8.8-4.4a1 1 0 0 0 0-1.8Z"/>
            <path d="M22 10.5V16"/>
            <path d="M6 12.9V17a6 3 0 0 0 12 0v-4.1"/>
        </svg>
    </div>
    <h2>校园活动报名系统</h2>
    <p class="subtitle">登录以浏览、发布和管理校园活动</p>

    <div th:if="${error}" class="error-msg"><span th:text="${error}"></span></div>

    <form th:action="@{/login}" method="post">
        <div class="form-item">
            <label for="username">用户名</label>
            <input id="username" type="text" name="username" placeholder="请输入用户名" required autocomplete="username">
        </div>
        <div class="form-item">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">登录</button>
    </form>

    <div class="tips">
        测试账号
        <div class="user-types">
            <span class="user-type admin-type">管理员：<code>admin</code></span>
            <span class="user-type student-type">学生：<code>student01</code></span>
        </div>
        <div style="margin-top:6px;">密码统一：<code>123456</code></div>
    </div>
</div>
</body>
</html>
