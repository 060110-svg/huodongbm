<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的报名 - 校园活动报名系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="header">
    <div style="display:flex;align-items:center;">
        <a th:if="${user != null and user.role == 'admin'}" th:href="@{/index}" class="back-btn" title="返回首页">‹</a>
        <a th:if="${user != null and user.role == 'student'}" th:href="@{/home}" class="back-btn" title="返回主页">‹</a>
        <h1>
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.4 11 12.6 6.6a1.6 1.6 0 0 0-1.2 0L2.6 11a1 1 0 0 0 0 1.8l8.8 4.4a1.6 1.6 0 0 0 1.2 0l8.8-4.4a1 1 0 0 0 0-1.8Z"/>
                <path d="M22 10.5V16"/>
                <path d="M6 12.9V17a6 3 0 0 0 12 0v-4.1"/>
            </svg>
            <span class="grad-text">校园活动报名系统</span>
        </h1>
    </div>
    <div class="user-info">
        <span class="user-chip student"><span th:text="${user.realName}"></span></span>
        <a th:href="@{/logout}" class="btn btn-danger">退出</a>
    </div>
</div>

<div class="container">
    <div class="page-hero hero-pink">
        <div class="page-hero-content">
            <h2>我的报名</h2>
            <p>查看和管理你报名的所有活动</p>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="table-wrap" th:if="${registrationList != null and !registrationList.isEmpty()}">
        <table>
            <tr>
                <th>报名时间</th>
                <th>活动标题</th>
                <th>状态</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
            <tr th:each="reg : ${registrationList}">
                <td th:text="${reg.registerTime != null} ? ${#dates.format(reg.registerTime, 'yyyy-MM-dd HH:mm')} : '-'"></td>
                <td class="cell-title" th:text="${reg.activityTitle}"></td>
                <td>
                    <span class="status-tag status-registered" th:if="${reg.status == 'registered'}">待审核</span>
                    <span class="status-tag status-approved" th:if="${reg.status == 'approved'}">已通过</span>
                    <span class="status-tag status-rejected" th:if="${reg.status == 'rejected'}">已拒绝</span>
                    <span class="status-tag status-cancelled" th:if="${reg.status == 'cancelled'}">已取消</span>
                </td>
                <td th:text="${reg.remark} != null ? ${reg.remark} : '-'"></td>
                <td style="white-space:nowrap;">
                    <a th:href="@{/activity/detail(id=${reg.activityId})}" class="link-primary" style="margin-right:14px;">查看活动</a>
                    <a th:if="${reg.status == 'registered' or reg.status == 'approved'}" th:href="@{/registration/cancel(id=${reg.id})}" class="cancel-reg-btn link-danger" th:data-act-title="${reg.activityTitle}">取消报名</a>
                </td>
            </tr>
        </table>
    </div>

    <div th:if="${registrationList == null or registrationList.isEmpty()}" class="empty">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
                <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
            </svg>
        </div>
        <h3>还没有报名任何活动</h3>
        <p>去活动广场看看有什么感兴趣的吧</p>
        <a th:href="@{/activity/list}" class="btn btn-primary">前往活动广场</a>
    </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-dialog">
        <div class="confirm-icon danger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="m4.9 4.9 14.2 14.2"/>
            </svg>
        </div>
        <div class="confirm-title">取消报名</div>
        <div class="confirm-message" id="confirmMessage">确定取消该活动的报名吗？</div>
        <div class="confirm-btns">
            <button class="confirm-cancel" id="confirmCancel">再想想</button>
            <button class="confirm-ok danger" id="confirmOk">确认取消</button>
        </div>
    </div>
</div>

<script>
(function(){
    var overlay = document.getElementById('confirmOverlay');
    var msg = document.getElementById('confirmMessage');
    var okBtn = document.getElementById('confirmOk');
    var cancelBtn = document.getElementById('confirmCancel');
    var currentHref = '';
    document.querySelectorAll('.cancel-reg-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
            e.preventDefault();
            var title = btn.getAttribute('data-act-title') || '该活动';
            msg.innerHTML = '确定取消「<strong>' + title + '</strong>」的报名吗？<br>取消后需要重新报名才能参加。';
            currentHref = btn.getAttribute('href');
            overlay.classList.add('show');
        });
    });
    function close(){ overlay.classList.remove('show'); }
    cancelBtn.addEventListener('click', close);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
    okBtn.addEventListener('click', function(){
        if(currentHref) window.location.href = currentHref;
        close();
    });
})();
</script>
</body>
</html>
